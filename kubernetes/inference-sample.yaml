apiVersion: v1
kind: Namespace
metadata:
  name: cross-region-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-vllm
  namespace: cross-region-inference
spec:
  replicas: 1
  # Recreate is required: each replica claims the node's only GPU and the
  # hostNetwork port, so a RollingUpdate surge pod can never schedule.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remote-vllm
  template:
    metadata:
      labels:
        app: remote-vllm
        sample.eks.aws/tier: remote-inference
    spec:
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: public.ecr.aws/deep-learning-containers/vllm:0.31.0-gpu-py312-cu130-ubuntu24.04-ec2-v1.1-soci@sha256:f98e7e3379594fa55bbb30d0ec8d441f3328dba7a02b45bd3cf6dda91e1d64d2
          args:
            - --model
            - Qwen/Qwen2.5-0.5B-Instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            # Optional Hugging Face token for gated or rate-limited models.
            # Create it with:
            #   kubectl -n cross-region-inference create secret generic hf-token \
            #     --from-literal=token=<your-hf-token>
            # The pod starts without the Secret; open models such as
            # Qwen/Qwen2.5-0.5B-Instruct do not require it.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: remote-vllm
  namespace: cross-region-inference
spec:
  selector:
    app: remote-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http